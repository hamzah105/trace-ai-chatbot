name: TRACE offline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-offline-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out public history for legacy byte comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up declared frontend test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.1'
      - name: Install pinned declared test dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Check resolved dependencies
        run: python -m pip check
      - name: Verify exact interpreter ZIP policy
        run: python -I -S -B tools/test_ci_guard.py
      - name: Verify frozen bytes and run guarded synthetic Python tests
        run: python -I -S -B tools/run_ci.py --selection python --artifacts "${{ runner.temp }}/trace-python-ci"
      - name: Run guarded synthetic frontend tests
        run: python -I -S -B tools/run_ci.py --selection frontend --artifacts "${{ runner.temp }}/trace-frontend-ci"
      - name: Preserve synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trace-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/trace-*-ci/run-record.json
            ${{ runner.temp }}/trace-*-ci/fixture-integrity.json
            ${{ runner.temp }}/trace-*-ci/test-classification.json
            ${{ runner.temp }}/trace-*-ci/dependency-versions.json
            ${{ runner.temp }}/trace-*-ci/resource-samples.jsonl
            ${{ runner.temp }}/trace-*-ci/tests/junit.xml
            ${{ runner.temp }}/trace-*-ci/tests/test-accounting.json
            ${{ runner.temp }}/trace-*-ci/tests/offline-events.jsonl
            ${{ runner.temp }}/trace-*-ci/tests/node-offline-events.jsonl
            ${{ runner.temp }}/trace-*-ci/tests/stdout.txt
            ${{ runner.temp }}/trace-*-ci/tests/stderr.txt
