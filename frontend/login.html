<!DOCTYPE html>
<html>
<head>
    <title>TRACE AI Chatbot</title>

    <link rel="stylesheet" href="/style.css">

    <link
        rel="icon"
        type="image/png"
        href="/yin.png">
</head>

<body>

<div class="auth-container">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Login to continue your TRACE AI conversation</p>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <div id="toastMessage" class="toast-message auth-toast"></div>

    <button onclick="login()">Login</button>

    <p class="auth-text">
        No account?
        <a class="auth-link" href="/register.html">Register</a>
    </p>
</div>

<script>
function showToast(message, type = "success") {
    const toast = document.getElementById("toastMessage");

    toast.innerText = message;
    toast.className = "toast-message auth-toast show " + type;

    setTimeout(() => {
        toast.className = "toast-message auth-toast";
    }, 3000);
}

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        showToast("Please enter email and password.", "error");
        return;
    }

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        showToast(
            data.message,
            data.success ? "success" : "error"
        );

        if (data.success) {
            localStorage.setItem("username", data.name);

            setTimeout(() => {
                window.location.href = "/index.html";
            }, 900);
        }

    } catch (error) {
        showToast("Unable to connect to TRACE backend.", "error");
    }
}
</script>

</body>
</html>
